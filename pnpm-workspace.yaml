packages:
  - "apps/*"
  - "packages/*"

# Patches de segurança para dependências transitivas (pnpm audit)
overrides:
  "lodash@<4.17.24": ">=4.17.24"
  "multer@<2.2.0": ">=2.2.0"
  "postcss@<8.5.10": ">=8.5.10"
  "js-yaml@>=4.0.0 <4.1.2": "^4.1.2"
  "qs@>=6.11.1 <6.15.2": ">=6.15.2"
  "serialize-javascript@<7.0.3": ">=7.0.3"
  "uuid@>=11.0.0 <11.1.1": "^11.1.1"
  "@babel/core@<7.29.1": "^7.29.1"
  "tar@<7.5.16": ">=7.5.16"

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@sentry/cli': true
  bcrypt: true
  esbuild: true
  prisma: true
  sharp: true
  tesseract.js: true
